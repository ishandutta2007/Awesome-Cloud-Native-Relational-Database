<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Drop Shadow for Text -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px #06b6d4); }
    }
    @keyframes float-cloud {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .node-pulse { animation: pulse-node 4s ease-in-out infinite; transform-origin: center; }
    .node-pulse-delay { animation: pulse-node 4s ease-in-out 2s infinite; transform-origin: center; }
    .cloud-float { animation: float-cloud 6s ease-in-out infinite; }
    .data-stream { stroke-dasharray: 8 6; animation: dash-flow 2s linear infinite; }
    .ring-rotate { animation: spin-slow 25s linear infinite; transform-origin: 600px 200px; }
  </style>

  <!-- Base Layer: Dark Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Radial Glow Behind Banner -->
  <circle cx="600" cy="200" r="450" fill="url(#center-glow)"/>

  <!-- Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Background Rotating Tech Rings -->
  <g opacity="0.25" class="ring-rotate">
    <circle cx="600" cy="200" r="160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 12 4 12"/>
    <circle cx="600" cy="200" r="230" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="20 40 10 5"/>
  </g>

  <!-- Dynamic Network Connection Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="150" y1="100" x2="300" y2="180" class="data-stream" />
    <line x1="300" y1="180" x2="200" y2="300" class="data-stream" />
    <line x1="1050" y1="120" x2="900" y2="220" class="data-stream" />
    <line x1="900" y1="220" x2="1000" y2="320" class="data-stream" />
  </g>

  <!-- Background Animated Database Cylinders -->
  <g opacity="0.3" class="cloud-float">
    <g transform="translate(120, 160)" class="node-pulse">
      <ellipse cx="30" cy="10" rx="30" ry="10" fill="#06b6d4"/>
      <path d="M 0 10 L 0 40 A 30 10 0 0 0 60 40 L 60 10 Z" fill="#0891b2"/>
      <path d="M 0 40 L 0 70 A 30 10 0 0 0 60 70 L 60 40 Z" fill="#0e7490"/>
    </g>
    <g transform="translate(1010, 180)" class="node-pulse-delay">
      <ellipse cx="30" cy="10" rx="30" ry="10" fill="#a855f7"/>
      <path d="M 0 10 L 0 40 A 30 10 0 0 0 60 40 L 60 10 Z" fill="#9333ea"/>
      <path d="M 0 40 L 0 70 A 30 10 0 0 0 60 70 L 60 40 Z" fill="#7e22ce"/>
    </g>
  </g>

  <!-- Foreground Content: Pill -->
  <g transform="translate(600, 75)" filter="url(#shadow)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">
      ⚡ CLOUD-NATIVE &amp; DISTRIBUTED SQL
    </text>
  </g>

  <!-- Foreground Content: Main Title -->
  <text x="600" y="165" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" filter="url(#shadow)" letter-spacing="-0.5">
    Awesome Cloud-Native Relational Database
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" text-anchor="middle" filter="url(#shadow)">
    Serverless Postgres • Distributed SQL • HTAP Systems • Managed Cloud Platforms
  </text>

  <!-- Category Badges / Tags -->
  <g transform="translate(600, 275)" filter="url(#shadow)">
    <g transform="translate(-240, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="0" y="5" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🐘 PostgreSQL</text>
    </g>
    <g transform="translate(-80, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="0" y="5" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Serverless</text>
    </g>
    <g transform="translate(80, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="0" y="5" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Distributed SQL</text>
    </g>
    <g transform="translate(240, 0)">
      <rect x="-55" y="-16" width="110" height="32" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
      <text x="0" y="5" fill="#fb7185" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📊 HTAP</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#cyan-glow)"/>
</svg>
